<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/theme.css">
  <style>body { width: 390px; }</style>
</head>
<body>
  <div class="header">
    <h1>AI Subtitle</h1>
    <span class="version" id="version"></span>
  </div>

  <div class="status">
    <div id="status-dot" class="status-dot disconnected"></div>
    <span id="status-text">Disconnected</span>
  </div>

  <form id="settings-form">
    <div class="section">
      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="chrome-builtin">Chrome Built-in (no key)</option>
          <option value="custom">Custom / Local</option>
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
          <option value="claude">Claude</option>
        </select>
      </div>
      <div class="field">
        <label for="auth-mode">Auth</label>
        <select id="auth-mode">
          <option value="apiKey">API Key</option>
          <option value="oauth">OAuth</option>
        </select>
        <div class="help-text" id="provider-help"></div>
      </div>
      <div class="field">
        <label for="ws-url">Endpoint</label>
        <input type="text" id="ws-url" value="http://127.0.0.1:8085" placeholder="http://127.0.0.1:8085">
      </div>
      <div class="field" id="api-key-group">
        <label for="api-key">API Key (optional)</label>
        <input type="text" id="api-key" value="" placeholder="sk-... (cloud only)">
      </div>
      <div class="field" id="oauth-panel" style="display: none;">
        <label for="oauth-client-id">Google OAuth Client ID</label>
        <input type="text" id="oauth-client-id" value="" placeholder="...apps.googleusercontent.com">
        <div class="field">
          <label for="google-project-id">Google Cloud Project ID</label>
          <input type="text" id="google-project-id" value="" placeholder="my-gemini-project">
        </div>
        <div class="field">
          <label for="oauth-redirect-uri">Redirect URI</label>
          <input type="text" id="oauth-redirect-uri" value="" readonly>
        </div>
        <div class="button-row">
          <button type="button" class="btn" id="oauth-connect-btn">Connect Google OAuth</button>
          <button type="button" class="btn secondary" id="oauth-disconnect-btn">Disconnect</button>
        </div>
        <div class="oauth-status" id="oauth-status">Not connected</div>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input type="text" id="model" value="auto" placeholder="auto, keeper:translator, gpt-4o, ...">
      </div>
      <div class="field">
        <label for="target-lang">Target Language</label>
        <select id="target-lang">
          <option value="ko">Korean</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="field checkbox-row">
        <input type="checkbox" id="dual-subtitles" checked>
        <label for="dual-subtitles">Dual subtitles (original + translated)</label>
      </div>
      <div class="field">
        <label for="font-size">Font Size</label>
        <input type="number" id="font-size" value="18" min="12" max="36" step="1">
      </div>
      <div class="field">
        <label for="position">Overlay Position</label>
        <select id="position">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
        </select>
      </div>
    </div>
  </form>

  <div class="section" style="padding: 8px 16px; display: flex; gap: 8px;">
    <button type="button" class="btn" id="open-sidepanel-btn" style="flex:1; background:#1e3a5f; border-color:#3b82f6;">Open Side Panel</button>
    <button type="button" class="btn secondary" id="clear-cache-btn" style="flex:0 0 auto;">Clear Cache</button>
  </div>

  <div class="debug-toggle" id="debug-toggle">
    <span>Debug Log</span>
    <span class="arrow" id="debug-arrow">&#9654;</span>
  </div>
  <div class="debug-panel" id="debug-panel">
    <div class="debug-empty" id="debug-empty">No logs yet. Open a YouTube video.</div>
    <pre id="debug-log"></pre>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
