<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1a1a2e;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .header .version {
      font-size: 11px;
      color: #64748b;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    .status-dot.connected { background: #4ade80; }
    .status-dot.connecting { background: #facc15; }
    .status-dot.translating { background: #60a5fa; animation: pulse 1s infinite; }
    .status-dot.disconnected { background: #ef4444; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .section {
      padding: 12px 16px;
    }
    .section + .section {
      border-top: 1px solid #0f3460;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 6px 8px;
      background: #0f3460;
      border: 1px solid #1a1a4e;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #533483;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-row label {
      margin: 0;
      text-transform: none;
      font-size: 13px;
      color: #e0e0e0;
    }
    .field + .field {
      margin-top: 10px;
    }

    /* Debug panel */
    .debug-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #0d1b2a;
      border-top: 1px solid #0f3460;
      cursor: pointer;
      user-select: none;
    }
    .debug-toggle:hover { background: #162032; }
    .debug-toggle span { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .debug-toggle .arrow { color: #64748b; font-size: 10px; }
    .debug-panel {
      display: none;
      max-height: 200px;
      overflow-y: auto;
      background: #0a0f1a;
      border-top: 1px solid #0f3460;
      padding: 8px;
    }
    .debug-panel.open { display: block; }
    .debug-panel pre {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 10px;
      line-height: 1.5;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .debug-panel .ts { color: #475569; }
    .debug-panel .inject { color: #60a5fa; }
    .debug-panel .bg { color: #4ade80; }
    .debug-panel .err { color: #f87171; }
    .debug-empty {
      color: #475569;
      font-size: 11px;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Subtitle</h1>
    <span class="version">v0.7.0</span>
  </div>

  <div class="status">
    <div id="status-dot" class="status-dot disconnected"></div>
    <span id="status-text">Disconnected</span>
  </div>

  <form id="settings-form">
    <div class="section">
      <div class="field">
        <label for="ws-url">Agent URL</label>
        <input type="text" id="ws-url" value="http://127.0.0.1:8085" placeholder="http://127.0.0.1:8085">
      </div>
      <div class="field">
        <label for="api-key">API Key (optional)</label>
        <input type="text" id="api-key" value="" placeholder="sk-... (cloud only)">
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input type="text" id="model" value="auto" placeholder="auto, keeper:translator, gpt-4o, ...">
      </div>
      <div class="field">
        <label for="target-lang">Target Language</label>
        <select id="target-lang">
          <option value="ko">Korean</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="field checkbox-row">
        <input type="checkbox" id="dual-subtitles" checked>
        <label for="dual-subtitles">Dual subtitles (original + translated)</label>
      </div>
      <div class="field">
        <label for="font-size">Font Size</label>
        <input type="number" id="font-size" value="18" min="12" max="36" step="1">
      </div>
      <div class="field">
        <label for="position">Overlay Position</label>
        <select id="position">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
        </select>
      </div>
    </div>
  </form>

  <div class="debug-toggle" id="debug-toggle">
    <span>Debug Log</span>
    <span class="arrow" id="debug-arrow">&#9654;</span>
  </div>
  <div class="debug-panel" id="debug-panel">
    <div class="debug-empty" id="debug-empty">No logs yet. Open a YouTube video.</div>
    <pre id="debug-log"></pre>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
