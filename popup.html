<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1a1a2e;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    .status-dot.connected { background: #4ade80; }
    .status-dot.connecting { background: #facc15; }
    .status-dot.translating { background: #60a5fa; animation: pulse 1s infinite; }
    .status-dot.disconnected { background: #ef4444; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .section {
      padding: 12px 16px;
    }
    .section + .section {
      border-top: 1px solid #0f3460;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 6px 8px;
      background: #0f3460;
      border: 1px solid #1a1a4e;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #533483;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-row label {
      margin: 0;
      text-transform: none;
      font-size: 13px;
      color: #e0e0e0;
    }
    .field + .field {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Subtitle</h1>
  </div>

  <div class="status">
    <div id="status-dot" class="status-dot disconnected"></div>
    <span id="status-text">Disconnected</span>
  </div>

  <form id="settings-form">
    <div class="section">
      <div class="field">
        <label for="ws-url">Agent URL</label>
        <input type="text" id="ws-url" value="http://127.0.0.1:8085" placeholder="http://127.0.0.1:8085">
      </div>
      <div class="field">
        <label for="api-key">API Key (optional)</label>
        <input type="text" id="api-key" value="" placeholder="sk-... (cloud only)">
      </div>
      <div class="field">
        <label for="target-lang">Target Language</label>
        <select id="target-lang">
          <option value="ko">Korean</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="field checkbox-row">
        <input type="checkbox" id="dual-subtitles" checked>
        <label for="dual-subtitles">Dual subtitles (original + translated)</label>
      </div>
      <div class="field">
        <label for="font-size">Font Size</label>
        <input type="number" id="font-size" value="18" min="12" max="36" step="1">
      </div>
      <div class="field">
        <label for="position">Overlay Position</label>
        <select id="position">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
        </select>
      </div>
    </div>
  </form>

  <script src="dist/popup.js"></script>
</body>
</html>
