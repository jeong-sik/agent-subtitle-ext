<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/theme.css">
  <style>
    /* Side panel: no fixed width, Chrome controls it */

    /* Progress section */
    .progress-section {
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: none;
    }
    .progress-section.active {
      display: block;
    }
    .progress-header {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-pct {
      font-size: 28px;
      font-weight: 700;
      color: #e0e0e0;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .progress-pct .unit { font-size: 14px; color: #64748b; font-weight: 400; }
    .playable-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: middle;
    }
    .playable-badge.ready { background: #166534; color: #4ade80; }
    .playable-badge.buffering { background: #1e3a5f; color: #60a5fa; }
    .playable-badge.waiting { background: #422006; color: #facc15; }
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #4ade80;
      border-radius: 5px;
      transition: width 0.3s ease;
    }
    .metrics-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #94a3b8;
    }
    .metrics-row span {
      white-space: nowrap;
    }
    .tok-meter {
      color: #60a5fa;
      font-weight: 600;
    }
    .wall-time {
      color: #facc15;
    }

    /* Debug log: always visible, taller */
    .debug-section-header {
      padding: 8px 16px;
      background: #0d1b2a;
      border-top: 1px solid #0f3460;
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .debug-panel {
      display: block;
      max-height: 40vh;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Subtitle</h1>
    <span class="version" id="version"></span>
  </div>

  <div class="status">
    <div id="status-dot" class="status-dot disconnected"></div>
    <span id="status-text">Disconnected</span>
  </div>

  <!-- Progress (side panel only) -->
  <div class="progress-section" id="progress-section">
    <div class="progress-header" id="progress-header">Translation progress</div>
    <div>
      <span class="progress-pct" id="progress-pct">0<span class="unit">%</span></span>
      <span class="playable-badge waiting" id="playable-badge">waiting</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
    <div class="metrics-row">
      <span id="segment-count">0/0 segs</span>
      <span id="batch-count">0/0 batches</span>
      <span class="tok-meter" id="tok-per-sec">-- tok/s</span>
      <span class="wall-time" id="wall-time">0.0s</span>
    </div>
  </div>

  <!-- Settings form: identical IDs to popup.html -->
  <form id="settings-form">
    <div class="section">
      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="custom">Custom / Local</option>
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
          <option value="claude">Claude</option>
        </select>
      </div>
      <div class="field">
        <label for="auth-mode">Auth</label>
        <select id="auth-mode">
          <option value="apiKey">API Key</option>
          <option value="oauth">OAuth</option>
        </select>
        <div class="help-text" id="provider-help"></div>
      </div>
      <div class="field">
        <label for="ws-url">Endpoint</label>
        <input type="text" id="ws-url" value="http://127.0.0.1:8085" placeholder="http://127.0.0.1:8085">
      </div>
      <div class="field" id="api-key-group">
        <label for="api-key">API Key (optional)</label>
        <input type="text" id="api-key" value="" placeholder="sk-... (cloud only)">
      </div>
      <div class="field" id="oauth-panel" style="display: none;">
        <label for="oauth-client-id">Google OAuth Client ID</label>
        <input type="text" id="oauth-client-id" value="" placeholder="...apps.googleusercontent.com">
        <div class="field">
          <label for="google-project-id">Google Cloud Project ID</label>
          <input type="text" id="google-project-id" value="" placeholder="my-gemini-project">
        </div>
        <div class="field">
          <label for="oauth-redirect-uri">Redirect URI</label>
          <input type="text" id="oauth-redirect-uri" value="" readonly>
        </div>
        <div class="button-row">
          <button type="button" class="btn" id="oauth-connect-btn">Connect Google OAuth</button>
          <button type="button" class="btn secondary" id="oauth-disconnect-btn">Disconnect</button>
        </div>
        <div class="oauth-status" id="oauth-status">Not connected</div>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input type="text" id="model" value="auto" placeholder="auto, keeper:translator, gpt-4o, ...">
      </div>
      <div class="field">
        <label for="target-lang">Target Language</label>
        <select id="target-lang">
          <option value="ko">Korean</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="field checkbox-row">
        <input type="checkbox" id="dual-subtitles" checked>
        <label for="dual-subtitles">Dual subtitles (original + translated)</label>
      </div>
      <div class="field">
        <label for="font-size">Font Size</label>
        <input type="number" id="font-size" value="18" min="12" max="36" step="1">
      </div>
      <div class="field">
        <label for="position">Overlay Position</label>
        <select id="position">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
        </select>
      </div>
    </div>
  </form>

  <div class="section" style="padding: 8px 16px;">
    <button type="button" class="btn secondary" id="clear-cache-btn" style="width:100%;">Clear Translation Cache</button>
  </div>

  <!-- Debug log: always visible -->
  <div class="debug-section-header">Debug Log</div>
  <div class="debug-panel open" id="debug-panel">
    <div class="debug-empty" id="debug-empty">No logs yet. Open a YouTube video.</div>
    <pre id="debug-log"></pre>
  </div>

  <script src="dist/sidepanel.js"></script>
</body>
</html>
